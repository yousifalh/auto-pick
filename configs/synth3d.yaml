# Synthetic 3-D scene generation. Authored here; `python -m recog.sync_config`
# transcribes this to configs/synth3d.json, which is what Blender reads
# (Blender's bundled Python has no PyYAML).

render:
  res: [1280, 720]          # matches recog/dataset so both sources interchange
  samples: 192
  adaptive_threshold: 0.01
  denoise: true
  device: GPU               # OPTIX on the RTX 3060; falls back to CPU
  view_transform: AgX
  # MEASURED, over 30 scenes covering all 5 backdrops x 3 lighting presets
  # (see .superpowers/sdd/2026-08-05-blender-synthetic-dataset/tuning-report.md).
  # exposure is applied by the view transform, not by Cycles, so one render can
  # be written out at many exposures and the sweep below is exact rather than
  # sampled:
  #
  #   EV     obj px >0.98   frame >0.98   backdrop spread   boxes under 0.05
  #   -1.5      6.1%           2.5%           0.39               21.2%
  #   -2.5      0.9%           0.7%           0.48               15.8%
  #   -3.5      0.04%          0.00%          0.53               15.4%
  #   -4.5      0.01%          0.00%          0.54               17.5%
  #
  # Below -3.5 nothing more is won: clipping is already gone, the spread has
  # flattened, and the low-contrast fraction turns back UP because the dark end
  # starts colliding instead (conveyor_belt against cell_black/shell_black).
  # -3.5 is that turning point.
  #
  # THIS IS NOW ONLY THE FALLBACK. `param_space.exposure` samples a per-scene
  # value and generate3d hands it to render.render_beauty; this constant is
  # what gets used when a config omits `param_space.exposure` entirely. It is
  # deliberately still the measured optimum, so dropping the param_space entry
  # restores exactly the old behaviour.
  exposure: -3.5
  max_bounces: 12
  clamp_indirect: 10.0
  film_transparent: false
  persistent_data: true

layout:
  area: [0.80, 0.45]        # metres; 16:9 to match render aspect, no wasted frame
  mode: scatter
  pad: 0.008
  max_tries: 500
  jitter_deg: 2.0           # hard cap on off-axis tilt; keeps footprints AABB
  allow_90s: true
  jig_clearance: 0.004      # metres of pocket margin around each part
  jig_jitter_deg: 1.0       # smaller than scatter: must stay inside the pocket
  jig_depth: [0.006, 0.012]
  jig_wall: 0.003           # metres of plate material left between pockets

camera:
  ortho: true
  height: 0.90
  margin_range: [1.02, 1.10]
  shift_range: [-0.006, 0.006]
  focal: 50.0

filter:
  min_px: 80
  min_side: 6
  # INERT under the current pipeline - it is a threshold with nothing to
  # threshold, kept because the machinery around it is correct and would start
  # working the moment overlapping layouts exist. Two independent reasons:
  #  * a visible_fraction is only computed when generate3d is run with
  #    --visibility, and both layout solvers (layout.plan and layout.plan_jig)
  #    guarantee exact AABB non-overlap, so no LABELLED instance can occlude
  #    another. The only occluders in a scene - jig plate, PCB, backdrop -
  #    carry pass_index 0. Batteries therefore always measure exactly 1.0.
  #  * annotate.merge_group_boxes hard-codes visible_fraction = None on every
  #    merged box, and every `cartridge` is merged, so this never applies to a
  #    cartridge at all.
  min_visibility: 0.25
  drop_truncated: false

param_space:
  n_assemblies: [1, 4]
  layout_mode:
    scatter: 0.7            # domain randomization: learn shape, not context
    jig: 0.3                # in-distribution coverage of the real fixture
  backdrop: [concrete, brushed_metal, fabric, paper, conveyor_belt]
  lighting: [overcast_softbox, harsh_inspection, warm_indoor,
             fluorescent_factory, high_bay_led, dim_workshop, mixed_daylight]
  # Per-scene exposure, in stops, applied by the view transform. Sampled here
  # rather than fixed at render.exposure because a single value tone-maps every
  # scene identically: measured over 20 scenes at the old fixed -3.5, the spread
  # of mean frame luminance was 0.170 and essentially ALL of it came from the
  # backdrop (fabric/belt 0.26-0.40, paper/concrete/metal 0.63-0.79) rather than
  # from anything to do with light level. Nothing was dark; the darkest whole
  # frame in the set measured 0.258.
  #
  # The range is deliberately ASYMMETRIC about the old -3.5. There is almost no
  # headroom upward - the brightest scenes already measured 0.79 mean and the
  # measured sweep puts clip_obj at 0.14% by -3.0 and 0.92% by -2.5 - so the
  # room to widen is downward, which is also what was actually asked for.
  #
  # The bottom end is -5.2, not the -5.8 first tried. -5.8 was measured as too
  # far: it does not blow anything out, but stacked on the darkest rig and the
  # darkest backdrop it drove object-to-background contrast under one 8-bit
  # level, which is annotated noise rather than a dark scene. See the note on
  # `dim_workshop`. -5.2 is still 1.7 stops under the old fixed -3.5.
  exposure: [-5.2, -3.2]

# Which materials each CAD role may draw from.
role_materials:
  case: [shell_white, shell_black, shell_navy, shell_alu]
  cell: [cell_green, cell_blue, cell_black, cell_nickel, cell_purple, cell_grey]

# Ranges are [low, high], sampled per instance, so no two renders share a
# surface. Colours are [[r,g,b] low, [r,g,b] high] in linear space.
#
# `luma_ref` is the MEASURED display-referred luminance a part of this preset
# renders at, under `render.exposure`, as the median over the part's own mask
# pixels across 30 scenes spanning all 5 backdrops and all 3 lighting presets.
# It is not derivable from `color`: shell_navy's albedo (0.084 luma) is barely
# twice cell_black's (0.040) yet it renders more than twice as bright (0.589 vs
# 0.249), because a flat shell facing an overhead softbox is dominated by its
# clearcoat sheen while a cylinder's median pixel has curved away from the
# light. materials.for_role uses these to keep a part off a backdrop it would
# disappear into; re-measure them if exposure, lighting or the colours move.
materials:
  shell_white:
    color: [[0.68, 0.68, 0.67], [0.86, 0.86, 0.84]]
    luma_ref: 0.788
    metallic: [0.0, 0.10]
    roughness: [0.30, 0.55]
    coat: [0.15, 0.55]
    wear: [0.05, 0.30]
  shell_black:
    color: [[0.015, 0.015, 0.018], [0.055, 0.055, 0.06]]
    luma_ref: 0.436
    metallic: [0.0, 0.15]
    roughness: [0.28, 0.60]
    coat: [0.15, 0.60]
    wear: [0.05, 0.40]
  shell_navy:
    color: [[0.03, 0.05, 0.13], [0.07, 0.11, 0.24]]
    luma_ref: 0.589
    metallic: [0.0, 0.12]
    roughness: [0.30, 0.55]
    coat: [0.15, 0.55]
    wear: [0.05, 0.30]
  shell_alu:
    color: [[0.55, 0.56, 0.58], [0.74, 0.75, 0.77]]
    luma_ref: 0.835
    metallic: [0.85, 1.0]
    roughness: [0.20, 0.45]
    coat: [0.0, 0.0]
    wear: [0.10, 0.45]
  cell_green:
    color: [[0.06, 0.30, 0.07], [0.14, 0.42, 0.13]]
    luma_ref: 0.54
    metallic: [0.05, 0.25]
    roughness: [0.28, 0.48]
    coat: [0.20, 0.60]
    wear: [0.05, 0.35]
  cell_blue:
    color: [[0.04, 0.12, 0.38], [0.10, 0.22, 0.55]]
    luma_ref: 0.467
    metallic: [0.05, 0.25]
    roughness: [0.26, 0.46]
    coat: [0.20, 0.60]
    wear: [0.05, 0.35]
  cell_black:
    color: [[0.02, 0.02, 0.024], [0.06, 0.06, 0.065]]
    luma_ref: 0.249
    metallic: [0.0, 0.20]
    roughness: [0.32, 0.58]
    coat: [0.10, 0.50]
    wear: [0.05, 0.40]
  cell_nickel:
    color: [[0.62, 0.63, 0.65], [0.80, 0.81, 0.83]]
    luma_ref: 0.428
    metallic: [0.95, 1.0]
    roughness: [0.12, 0.35]
    coat: [0.0, 0.0]
    wear: [0.05, 0.45]
  # Purple and grey wraps are both visible in the real photos (IMG_4426).
  cell_purple:
    color: [[0.26, 0.16, 0.42], [0.42, 0.28, 0.62]]
    luma_ref: 0.544
    metallic: [0.05, 0.25]
    roughness: [0.28, 0.50]
    coat: [0.20, 0.60]
    wear: [0.05, 0.35]
  cell_grey:
    color: [[0.38, 0.38, 0.40], [0.58, 0.58, 0.60]]
    luma_ref: 0.655
    metallic: [0.05, 0.30]
    roughness: [0.30, 0.55]
    coat: [0.10, 0.50]
    wear: [0.05, 0.40]

# "image": path to a texture, or null to use the procedural generator.
#
# `color` is the two ends of the procedural texture's colour ramp, in LINEAR
# space - the surface's albedo range. It used to be a hard-coded palette inside
# world.py, which made the single most important property of a backdrop the one
# thing you could not see or change from the config.
#
# `luma_ref` is the MEASURED display-referred luminance a part standing on this
# backdrop has to compete with, under `render.exposure` above: the median over
# the ring of pixels immediately outside each labelled box. That ring is mostly
# backdrop but occasionally a neighbouring part, which is deliberate - it is
# what the object actually has to stand out from. Whole-frame background
# medians run higher (concrete 0.64, paper 0.66, brushed_metal 0.83, fabric
# 0.41, conveyor_belt 0.32) because the ring includes contact shadow.
#
# It is what the material draw is kept away from (see materials.MIN_LUMA_DELTA).
# It is a measurement, not an authored value, so re-measure it if the exposure,
# the lighting presets or these colours change materially. The procedure is in
# .superpowers/sdd/2026-08-05-blender-synthetic-dataset/tuning-report.md.
backdrops:
  concrete:
    image: null
    proc: concrete
    color: [[0.22, 0.22, 0.215], [0.46, 0.455, 0.44]]
    luma_ref: 0.458
    uv_scale: [1.5, 4.0]
    brightness: [-0.06, 0.06]
    roughness: [0.55, 0.85]
    bump: [0.05, 0.25]
  brushed_metal:
    image: null
    proc: brushed
    color: [[0.30, 0.305, 0.31], [0.52, 0.525, 0.535]]
    luma_ref: 0.815
    uv_scale: [2.0, 6.0]
    brightness: [-0.04, 0.08]
    roughness: [0.35, 0.55]
    bump: [0.02, 0.10]
  # Authored as dark navy cloth and rendering as mid-grey: at the old exposure
  # it measured 0.488, three hundredths from concrete's 0.458, so two of the
  # five backdrops were the same tone and the axis carried no variety. Darkened
  # to what the name says it is, which also moves it out of the middle of the
  # cell colours (0.43-0.66), where it was responsible for 21 of the 37
  # low-contrast boxes on its own.
  fabric:
    image: null
    proc: fabric
    color: [[0.05, 0.06, 0.08], [0.12, 0.135, 0.165]]
    luma_ref: 0.433
    uv_scale: [6.0, 18.0]
    brightness: [-0.05, 0.05]
    roughness: [0.70, 0.95]
    bump: [0.10, 0.35]
  # Kraft rather than bleached white. At 0.76-0.90 albedo this sat directly on
  # top of shell_white (0.68-0.86) and shell_alu (0.55-0.77) - the two most
  # realistic case colours - so a white shell on paper was correctly labelled
  # and invisible. Darkening it is what lets those two shells still be drawn
  # here at all instead of being excluded by the contrast rule below.
  paper:
    image: null
    proc: paper
    color: [[0.44, 0.42, 0.37], [0.54, 0.51, 0.45]]
    luma_ref: 0.689
    uv_scale: [1.0, 3.0]
    brightness: [-0.03, 0.10]
    roughness: [0.60, 0.90]
    bump: [0.01, 0.08]
  conveyor_belt:
    image: null
    proc: belt
    color: [[0.035, 0.035, 0.038], [0.115, 0.115, 0.12]]
    luma_ref: 0.233
    uv_scale: [3.0, 8.0]
    brightness: [-0.08, 0.02]
    roughness: [0.50, 0.80]
    bump: [0.15, 0.45]

# Two kinds are in play here.
#
# `camera_softbox` hangs the lamp at the camera. Under this top-down camera
# that makes the light coaxial with the view: shading is flat and every cast
# shadow falls exactly behind the object that cast it, hidden from the camera.
# All three original rigs are that kind, so the dataset contained no visible
# cast shadow at all, while the reference factory photos are full of them.
#
# `off_axis` places the lamp at a drawn (azimuth, elevation, distance) and aims
# it at the origin - see recog/synth3d/lightrig.py. Azimuth spans the full
# circle and elevation spans each rig's own band, so shadow direction and
# shadow length both vary scene to scene.
#
# Energies are NOT comparable between the two kinds. A camera_softbox sits
# ~0.87 m above the parts; an off_axis lamp sits 1.0-2.6 m away and strikes a
# horizontal surface at an angle, so it needs roughly (d/0.87)^2 / cos(90-el)
# times the power for the same illuminance - a factor of 3 to 8. The numbers
# below were calibrated by rendering, not derived.
#
# `tint` is a per-channel multiplier applied on top of the blackbody colour.
# It exists because real fluorescent tubes are not blackbody radiators - they
# are mercury discharge behind a phosphor, with a spike near 546 nm - so a
# fluorescent-lit factory has a green cast that no colour temperature can
# reproduce. Without it, every illuminant in the training set lies on the
# Planckian locus and every real fluorescent photo is off-model.
lighting:
  overcast_softbox:
    kind: camera_softbox
    energy: [120.0, 260.0]
    size: [0.9, 1.6]
    kelvin: [5600, 6800]
    offset: [0.0, 0.10]
    world_strength: [0.25, 0.55]
    world_kelvin: [6000, 8000]
    hdri: null
    hdri_strength: [0, 0]
    hdri_rotation: [0, 0]
  harsh_inspection:
    kind: camera_softbox
    energy: [80.0, 150.0]
    size: [0.10, 0.25]
    kelvin: [5000, 6000]
    offset: [0.0, 0.05]
    world_strength: [0.02, 0.12]
    world_kelvin: [5500, 7000]
    hdri: null
    hdri_strength: [0, 0]
    hdri_rotation: [0, 0]
  warm_indoor:
    kind: camera_softbox
    energy: [140.0, 300.0]
    size: [0.4, 0.9]
    kelvin: [2900, 3800]
    offset: [0.05, 0.22]
    world_strength: [0.15, 0.40]
    world_kelvin: [3200, 4500]
    hdri: null
    hdri_strength: [0, 0]
    hdri_rotation: [0, 0]

  # ---------------------------------------------------------------- off-axis --

  # Rows of overhead fluorescent tubes: the default light of every older
  # factory floor. Large source and a high elevation, so shadows are present
  # but soft and short; a healthy world_strength stands in for the bounce off
  # pale walls and ceiling that makes such a space fairly even. 4000-5000K with
  # the green cast that gives fluorescent-lit photographs their characteristic
  # look.
  fluorescent_factory:
    kind: off_axis
    energy: [700.0, 1300.0]
    size: [1.2, 2.2]
    kelvin: [4000, 5000]
    # Softened from [0.95, 1.06, 0.93]: stacked on a 4000-5000K blackbody that
    # read frankly olive rather than as the slight green a real tube gives.
    tint: [0.96, 1.045, 0.95]
    azimuth: [0, 360]
    elevation: [55, 80]
    distance: [1.6, 2.4]
    world_strength: [0.30, 0.60]
    world_kelvin: [4200, 5200]
    hdri: null
    hdri_strength: [0, 0]
    hdri_rotation: [0, 0]

  # Modern high-bay LED: brighter, cooler and much more compact than a tube,
  # so the shadows have hard edges. The low world_strength is what makes them
  # hard - a small source with a lot of ambient fill still reads soft, because
  # the ambient lifts the shadow interior back up.
  high_bay_led:
    kind: off_axis
    energy: [1400.0, 2600.0]
    size: [0.25, 0.60]
    kelvin: [5000, 6500]
    azimuth: [0, 360]
    elevation: [50, 78]
    distance: [1.8, 2.6]
    world_strength: [0.05, 0.18]
    world_kelvin: [5500, 7000]
    hdri: null
    hdri_strength: [0, 0]
    hdri_rotation: [0, 0]

  # The dark setting. A single warm bulb low down in a corner: low light level,
  # long shadows, high contrast.
  #
  # What makes this rig dark is the LOW ELEVATION and the near-absent ambient,
  # not a low energy. That distinction was measured, not assumed. An earlier
  # draft used energy [90, 260] with world_strength [0.005, 0.04], which is
  # about 1.8 stops under the other rigs. On its own that looked right - but
  # exposure is sampled per scene and multiplies it, so dim_workshop on
  # conveyor_belt at the bottom of the exposure range rendered as a black
  # frame: over 8 such scenes the median object-to-background luminance
  # difference was 0.9-1.6 of 255 levels in four of them, i.e. under the 8-bit
  # quantisation floor. Those images still carry full annotations, so they ask
  # the detector to find objects in pure noise - actively worse than dropping
  # them. Energy raised so the darkness comes mostly from the light's
  # GEOMETRY, which exposure cannot stack with, rather than from
  # underexposure, which it can.
  #
  # [300, 750] was the other end of that mistake: it made the rig no longer
  # dim at all - on concrete it measured 0.653 mean frame luminance, brighter
  # than overcast_softbox on the same backdrop. [170, 420] is the middle that
  # measured well on both guardrails at once.
  dim_workshop:
    kind: off_axis
    energy: [170.0, 420.0]
    size: [0.15, 0.50]
    kelvin: [2700, 3600]
    azimuth: [0, 360]
    elevation: [18, 42]
    distance: [1.0, 1.8]
    world_strength: [0.012, 0.055]
    world_kelvin: [3000, 4500]
    hdri: null
    hdri_strength: [0, 0]
    hdri_rotation: [0, 0]

  # Daylight through a window plus warm interior fill. Worth having because it
  # is the one rig here that breaks the single-illuminant assumption: the two
  # lamps differ by roughly 3500K and always arrive from different sides
  # (fill_azimuth_offset is an offset from the key, not an independent draw),
  # so one face of a part is lit cool and another warm at the same time. A
  # detector trained only on single-illuminant scenes can learn to treat
  # "colour of the lit face" as a material property, which it is not.
  mixed_daylight:
    kind: off_axis
    energy: [600.0, 1200.0]
    size: [1.0, 2.0]
    kelvin: [6000, 7800]
    azimuth: [0, 360]
    elevation: [22, 45]
    distance: [1.6, 2.4]
    fill_energy: [150.0, 400.0]
    fill_size: [0.8, 1.6]
    fill_kelvin: [2700, 3400]
    fill_azimuth_offset: [110, 250]
    fill_elevation: [45, 75]
    fill_distance: [1.2, 2.0]
    world_strength: [0.10, 0.30]
    world_kelvin: [5000, 7500]
    hdri: null
    hdri_strength: [0, 0]
    hdri_rotation: [0, 0]
