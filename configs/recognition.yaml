# Recognition module configuration
model:
  name: faster_rcnn
  backbone: resnet34_fpn
  num_classes: 3  # background, battery, cartridge
  # Sized for the Blender dataset's measured boxes at 1280x720: sqrt(area) is
  # 50-57 px for batteries and 112-185 px for cartridges, and an 18650 cell is
  # ~3.55:1. recog/model.py appends base_scales[-1]*2 as the P6 level, so the
  # covered range is 56-320 px. The old [4, 8, 16, 32] / max ratio 2.0 were
  # tuned for recog/synth_dataset.py's much smaller cv2 primitives and left
  # 20% of boxes below 0.5 best-IoU (cartridge median 0.21); these give a
  # minimum best-IoU of 0.57 with nothing below 0.5.
  anchor_ratios: [0.28, 0.5, 1.0, 2.0, 3.5]
  anchor_scales: [56, 80, 112, 160]
  roi_output_size: 7
  nms_iou: 0.4
  confidence_threshold: 0.70

dataset:
  img_dir: recog/dataset3d/images
  ann_dir: recog/dataset3d/annotations
  class_map:
    battery: 1
    cartridge: 2
  train_val_split: 0.85

augmentation:
  brightness_limit: 0.40
  contrast_limit: 0.40
  gamma_limit: [60, 140]
  hue_shift_limit: 15
  sat_shift_limit: 25
  val_shift_limit: 10
  gauss_noise_var: [10.0, 50.0]
  shadow_num_range: [1, 3]
  rotation_limit: 4
  scale_limit: 0.10
  p_photometric: 0.8
  p_geometric: 0.5

training:
  epochs: 60
  batch_size: 4
  num_workers: 4
  optimiser: sgd
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_scheduler: cosine
  frozen_bn_epochs: 20
  checkpoint_dir: recog/checkpoints
  log_dir: recog/runs
  pretrained: true

evaluation:
  iou_thresholds: [0.5, 0.75]
  centroid_error_target_px: 2.0
  edge_error_target_px: 4.0
