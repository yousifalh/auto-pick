# Recognition module configuration
model:
  name: faster_rcnn
  backbone: resnet34_fpn
  num_classes: 3  # background, battery, cartridge
  # anchor_ratios is unchanged and was re-checked, not merely kept: the
  # measured aspect histogram is bimodal on the 18650's own 65.0/18.3 = 3.55
  # and its reciprocal (batteries, 78% of boxes), with cartridges spread over
  # 0.33-2.7. Two retuned ratio lists and a 6-ratio and a 7-ratio list were all
  # scored against the data below; none moved the minimum at all and the
  # 6-ratio list made the cartridge median WORSE (0.733 -> 0.703), because the
  # binding constraint is the scale spacing, not aspect coverage. Extra ratios
  # are not free either - they multiply RPN anchors per location, and
  # training.batch_size is already 2 because of a fragmentation OOM.
  anchor_ratios: [0.28, 0.5, 1.0, 2.0, 3.5]
  #
  # anchor_scales is COUPLED to param_space.zoom in configs/synth3d.yaml.
  # [56, 80, 112, 160] was correct for the old fixed-framing dataset, whose
  # batteries spanned only 50-57 px sqrt(area) (a 1.10 ratio). Per-scene zoom
  # widens that to 29-74 px, and re-using the old anchors would put 15% of
  # boxes below 0.5 best-IoU - the same failure the old [4, 8, 16, 32] caused.
  #
  # MEASURED on 2434 boxes from 300 freshly generated scenes (two independent
  # seeds, 1280x720), best CENTRED IoU per box over every (scale, ratio) anchor
  # including the P6 level recog/model.py appends as base_scales[-1]*2, with
  # box sizes first put through torchvision's GeneralizedRCNNTransform
  # (min_size 800 / max_size 1333, the defaults recog/model.py deliberately
  # leaves alone) which scales a 1280x720 render by 1.041:
  #
  #   anchor_scales        +P6   min    p05    med    <0.5    <0.6   batt  cart
  #   [56, 80, 112, 160]   320   0.290  0.427  0.728  15.37%  26.71% 0.709 0.748
  #   [40, 64, 96, 144]    288   0.504  0.643  0.808   0.00%   2.14% 0.823 0.733
  #   [32, 51, 82, 131]    262   0.500  0.630  0.750   0.00%   2.63% 0.755 0.727
  #   [32, 50, 78, 127]    254   0.507  0.643  0.756   0.00%   2.88% 0.768 0.725
  #   [32, 54, 102, 171]   342   0.508  0.605  0.732   0.00%   3.78% 0.740 0.726
  #   [28, 44, 70, 112]    224   0.503  0.621  0.772   0.00%   4.27% 0.799 0.715
  #   [32, 46, 59, 112]    224   0.503  0.589  0.828   0.00%   5.75% 0.854 0.706
  #   [39, 68, 118, 204]   408   0.574  0.598  0.772   0.00%   5.83% 0.775 0.723
  #
  # [40, 64, 96, 144] wins on p05, median, both class medians and the fraction
  # under 0.6, and meets the bar (nothing below 0.5) on each seed separately -
  # 0.504 and 0.513. An exhaustive search over 84156 four-tuples found a
  # higher MINIMUM available ([39, 68, 118, 204], 0.574), and it is recorded
  # above rather than chosen: it buys 0.07 at the single worst box by pushing
  # 3.7% more of the corpus under 0.6, and torchvision's RPN assigns every
  # ground-truth box its best anchor regardless of threshold
  # (allow_low_quality_matches), so the bulk of the distribution is what
  # actually trains.
  #
  # The 0.504 minimum is a STRUCTURAL floor, not a tuning failure. model.py's
  # P6 level is exactly 2x the largest configured scale, and any factor-2 gap
  # has a trough at sqrt(2)*s where a same-aspect box scores exactly 0.50. The
  # 15 boxes between 0.50 and 0.52 are all cartridges at sqrt(area) 203-206,
  # i.e. sitting on 144*sqrt(2) = 204. No anchor set escapes this by more than
  # a few hundredths while the cartridge distribution is continuous across it.
  anchor_scales: [40, 64, 96, 144]
  roi_output_size: 7
  nms_iou: 0.4
  confidence_threshold: 0.70
  # Real photos are 3024x4032; the detector trains on 1280x720 renders where a
  # cell is ~28px wide. torchvision's default min_size=800 puts a real cell at
  # ~52px and roughly halves accuracy. Measured on the real-photo set:
  # 500 -> mAP@0.50 0.614 / @0.75 0.404;  800 -> 0.457 / 0.023;  1600 -> 0.000.
  inference_min_size: 500
  inference_max_size: 900

dataset:
  img_dir: recog/dataset3d/images
  ann_dir: recog/dataset3d/annotations
  # Per-scene sidecars from recog/generate3d.py. Not read for training data -
  # only to pick the HARD validation subset that checkpoint selection runs on.
  # The full-set synthetic metric saturates at mAP 1.0 within 0-5 epochs and
  # has picked a worse checkpoint three times running (best.pt 0.6858 against
  # last.pt 0.7296 on the six real photos). The sidecars already record every
  # drawn parameter, so the hard scenes - darkest exposure, highest zoom
  # (smallest parts), parts occluding each other - cost nothing to identify.
  # Leave this unset and training falls back to the saturating full-set
  # metric, with a warning.
  meta_dir: recog/dataset3d/meta
  # Fraction of the validation split to select on. At train_val_split 0.85
  # over 1000 images that is 150 val scenes, so 0.25 gives ~37 - small, but a
  # strict intersection of the three hardest conditions would give about 1.
  hard_val_fraction: 0.25
  class_map:
    battery: 1
    cartridge: 2
  train_val_split: 0.85

augmentation:
  # --- illumination ------------------------------------------------------
  # Widened from 0.40 / 0.40 / [60, 140]. Those were moderate: a scene could
  # be a bit dim or a bit bright, never actually dark or actually blown out,
  # so every training image sat in the same middle third of the tone range
  # while the real photos do not. gamma is the one that reaches genuine
  # darkness without crushing the black point - it rescales the tone curve
  # rather than subtracting a constant, so shadow detail survives.
  brightness_limit: 0.55
  contrast_limit: 0.50
  gamma_limit: [45, 190]
  hue_shift_limit: 15
  sat_shift_limit: 30
  val_shift_limit: 20
  shadow_num_range: [1, 3]
  # --- camera pose -------------------------------------------------------
  # Consumed by augmentation.Affine (albumentations 2.x deprecates
  # ShiftScaleRotate). One-sided limits, mirrored: 0.04 -> +/-4% of the side,
  # 0.10 -> scale 0.90-1.10, 4 -> +/-4 degrees.
  shift_limit: 0.04
  # 0.20, not 0.10. At +/-10% the affine block spans a 1.10/0.90 = 1.22 ratio
  # end to end, which cannot on its own cover the 1.51 ratio the real photos
  # show (batteries 43-65 px at the min_size=500 inference scale). +/-20% spans
  # exactly 1.50 - the real ratio - so the augmenter now reaches it unaided,
  # and it stacks with the render-time param_space.zoom that supplies 1.86.
  # It is not a substitute for that: it resamples one render rather than
  # producing a genuinely differently-framed scene, so it cannot add
  # perspective, sampling or shadow-scale variety. It is simply free.
  #
  # It does interact with anchor_scales, which is why it was not widened
  # further: the block fires on p_geometric * Affine.p = 25% of samples, and at
  # the bottom of the draw the smallest batteries land near 27 px against the
  # 40 px smallest anchor. That is a per-sample transient rather than a
  # property of the labels, and the RPN still assigns every ground-truth box
  # its best anchor, but at +/-40% it would stop being a transient.
  scale_limit: 0.20
  rotation_limit: 4
  # --- camera / sensor degradation ---------------------------------------
  # The renders are pin-sharp and noiseless; the real photos are handheld
  # phone shots. Without these the detector can key on render sharpness,
  # which nothing it will ever be shown at inference time has.
  motion_blur_limit: [3, 11]
  defocus_radius: [1, 5]
  iso_color_shift: [0.01, 0.06]
  iso_noise_intensity: [0.1, 0.7]
  # Normalised units, as albumentations 2.x GaussNoise.std_range wants.
  # Replaces the old `gauss_noise_var: [10.0, 50.0]`, which was dead config -
  # nothing read it and the code hard-coded (0.05, 0.2).
  gauss_noise_std_range: [0.02, 0.14]
  # --- block probabilities -----------------------------------------------
  # p_flip / p_rot90 are NOT multiplied by p_geometric: flips and 90-degree
  # rotations are label-exact in this top-down axis-aligned domain, so they
  # live in their own ungated block. See recog/augmentation.py.
  p_photometric: 0.85
  p_geometric: 0.5
  p_flip: 0.5
  p_rot90: 0.5
  p_blur: 0.35
  p_camera: 0.6

training:
  # 60 was tuned for the ~50-image cv2 synth set, where an epoch was 13 steps.
  # The Blender set is 1000 images / 250 steps per epoch, so 25 epochs is
  # ~6250 steps — a comparable amount of optimisation, not 20x more.
  # 35, not 25: the 25-epoch schedule was tuned when albumentations was
  # missing and training saw only the crude numpy fallback (brightness,
  # contrast, noise). With the real pipeline plus flips/rotations and a much
  # wider render-time lighting range, the effective dataset is far larger and
  # 25 epochs under-fits.
  epochs: 35
  # 2, not 4: at 1280x720 with 5 aspect ratios x 5 FPN levels, batch 4 peaks
  # near 6 GB and the RPN's filter_proposals then fails to find 256 MB
  # contiguous on a 12 GB card - a fragmentation OOM one second into epoch 0,
  # with 6.8 GB nominally free. Batch 2 peaks ~2.6 GB. Raise on a bigger card.
  batch_size: 2
  # 0, not 4: on Windows the dataloader uses spawn, and re-importing the
  # worker process per batch costs more than the parallelism buys at this
  # image size. Raise it on Linux.
  num_workers: 0
  optimiser: sgd
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_scheduler: cosine
  # No frozen_bn_epochs. BatchNorm is frozen — running statistics AND the
  # affine parameters — for the WHOLE run, which is torchvision's own
  # detection recipe and the right one at batch_size 2, where batch
  # statistics over two images are noise. The knob that used to sit here
  # said 8 and was half-inert: nothing ever restored requires_grad, so
  # gamma/beta were pinned for all 35 epochs while the running statistics
  # resumed updating at epoch 8 — the two halves disagreeing. Removed
  # rather than repaired on 2026-08-12; see recog/model.py::
  # freeze_batchnorm and docs/superpowers/specs/2026-08-12-fix-detector.md.
  # Randomness, same contract as configs/segmentation.yaml: `seed` fixes
  # model init, the shuffle order and the augmentation pipeline, is
  # logged every run and is written into best.pt/last.pt; `--seed`
  # overrides it. `deterministic` is off|warn|strict - see
  # recog/seeding.py and docs/receipts/seed_reproducibility.txt, which
  # measured the three modes on the SEGMENTER. The detector's own
  # published mAP figures predate all of this and came from unseeded
  # runs; seeding applies from now on and does not recover them.
  seed: 20260812
  deterministic: warn
  checkpoint_dir: recog/checkpoints
  log_dir: recog/runs
  pretrained: true

evaluation:
  iou_thresholds: [0.5, 0.75]
  centroid_error_target_px: 2.0
  edge_error_target_px: 4.0
