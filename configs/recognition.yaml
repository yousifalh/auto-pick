# Recognition module configuration
model:
  name: faster_rcnn
  backbone: resnet34_fpn
  num_classes: 3  # background, battery, cartridge
  # Sized for the Blender dataset's measured boxes at 1280x720: sqrt(area) is
  # 50-57 px for batteries and 112-185 px for cartridges, and an 18650 cell is
  # ~3.55:1. recog/model.py appends base_scales[-1]*2 as the P6 level, so the
  # covered range is 56-320 px. The old [4, 8, 16, 32] / max ratio 2.0 were
  # tuned for recog/synth_dataset.py's much smaller cv2 primitives and left
  # 20% of boxes below 0.5 best-IoU (cartridge median 0.21); these give a
  # minimum best-IoU of 0.57 with nothing below 0.5.
  anchor_ratios: [0.28, 0.5, 1.0, 2.0, 3.5]
  anchor_scales: [56, 80, 112, 160]
  roi_output_size: 7
  nms_iou: 0.4
  confidence_threshold: 0.70
  # Real photos are 3024x4032; the detector trains on 1280x720 renders where a
  # cell is ~28px wide. torchvision's default min_size=800 puts a real cell at
  # ~52px and roughly halves accuracy. Measured on the real-photo set:
  # 500 -> mAP@0.50 0.614 / @0.75 0.404;  800 -> 0.457 / 0.023;  1600 -> 0.000.
  inference_min_size: 500
  inference_max_size: 900

dataset:
  img_dir: recog/dataset3d/images
  ann_dir: recog/dataset3d/annotations
  class_map:
    battery: 1
    cartridge: 2
  train_val_split: 0.85

augmentation:
  # --- illumination ------------------------------------------------------
  # Widened from 0.40 / 0.40 / [60, 140]. Those were moderate: a scene could
  # be a bit dim or a bit bright, never actually dark or actually blown out,
  # so every training image sat in the same middle third of the tone range
  # while the real photos do not. gamma is the one that reaches genuine
  # darkness without crushing the black point - it rescales the tone curve
  # rather than subtracting a constant, so shadow detail survives.
  brightness_limit: 0.55
  contrast_limit: 0.50
  gamma_limit: [45, 190]
  hue_shift_limit: 15
  sat_shift_limit: 30
  val_shift_limit: 20
  shadow_num_range: [1, 3]
  # --- camera pose -------------------------------------------------------
  # Consumed by augmentation.Affine (albumentations 2.x deprecates
  # ShiftScaleRotate). One-sided limits, mirrored: 0.04 -> +/-4% of the side,
  # 0.10 -> scale 0.90-1.10, 4 -> +/-4 degrees.
  shift_limit: 0.04
  scale_limit: 0.10
  rotation_limit: 4
  # --- camera / sensor degradation ---------------------------------------
  # The renders are pin-sharp and noiseless; the real photos are handheld
  # phone shots. Without these the detector can key on render sharpness,
  # which nothing it will ever be shown at inference time has.
  motion_blur_limit: [3, 11]
  defocus_radius: [1, 5]
  iso_color_shift: [0.01, 0.06]
  iso_noise_intensity: [0.1, 0.7]
  # Normalised units, as albumentations 2.x GaussNoise.std_range wants.
  # Replaces the old `gauss_noise_var: [10.0, 50.0]`, which was dead config -
  # nothing read it and the code hard-coded (0.05, 0.2).
  gauss_noise_std_range: [0.02, 0.14]
  # --- block probabilities -----------------------------------------------
  # p_flip / p_rot90 are NOT multiplied by p_geometric: flips and 90-degree
  # rotations are label-exact in this top-down axis-aligned domain, so they
  # live in their own ungated block. See recog/augmentation.py.
  p_photometric: 0.85
  p_geometric: 0.5
  p_flip: 0.5
  p_rot90: 0.5
  p_blur: 0.35
  p_camera: 0.6

training:
  # 60 was tuned for the ~50-image cv2 synth set, where an epoch was 13 steps.
  # The Blender set is 1000 images / 250 steps per epoch, so 25 epochs is
  # ~6250 steps — a comparable amount of optimisation, not 20x more.
  # 35, not 25: the 25-epoch schedule was tuned when albumentations was
  # missing and training saw only the crude numpy fallback (brightness,
  # contrast, noise). With the real pipeline plus flips/rotations and a much
  # wider render-time lighting range, the effective dataset is far larger and
  # 25 epochs under-fits.
  epochs: 35
  # 2, not 4: at 1280x720 with 5 aspect ratios x 5 FPN levels, batch 4 peaks
  # near 6 GB and the RPN's filter_proposals then fails to find 256 MB
  # contiguous on a 12 GB card - a fragmentation OOM one second into epoch 0,
  # with 6.8 GB nominally free. Batch 2 peaks ~2.6 GB. Raise on a bigger card.
  batch_size: 2
  # 0, not 4: on Windows the dataloader uses spawn, and re-importing the
  # worker process per batch costs more than the parallelism buys at this
  # image size. Raise it on Linux.
  num_workers: 0
  optimiser: sgd
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_scheduler: cosine
  frozen_bn_epochs: 8
  checkpoint_dir: recog/checkpoints
  log_dir: recog/runs
  pretrained: true

evaluation:
  iou_thresholds: [0.5, 0.75]
  centroid_error_target_px: 2.0
  edge_error_target_px: 4.0
