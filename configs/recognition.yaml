# Recognition module configuration
model:
  name: faster_rcnn
  backbone: resnet34_fpn
  num_classes: 3  # background, battery, cartridge
  anchor_ratios: [0.33, 0.5, 1.0, 1.5, 2.0]
  anchor_scales: [4, 8, 16, 32]
  roi_output_size: 7
  nms_iou: 0.4
  confidence_threshold: 0.70

dataset:
  img_dir: recog/dataset3d/images
  ann_dir: recog/dataset3d/annotations
  class_map:
    battery: 1
    cartridge: 2
  train_val_split: 0.85

augmentation:
  brightness_limit: 0.40
  contrast_limit: 0.40
  gamma_limit: [60, 140]
  hue_shift_limit: 15
  sat_shift_limit: 25
  val_shift_limit: 10
  gauss_noise_var: [10.0, 50.0]
  shadow_num_range: [1, 3]
  rotation_limit: 4
  scale_limit: 0.10
  p_photometric: 0.8
  p_geometric: 0.5

training:
  epochs: 60
  batch_size: 4
  num_workers: 4
  optimiser: sgd
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_scheduler: cosine
  frozen_bn_epochs: 20
  checkpoint_dir: recog/checkpoints
  log_dir: recog/runs
  pretrained: true

evaluation:
  iou_thresholds: [0.5, 0.75]
  centroid_error_target_px: 2.0
  edge_error_target_px: 4.0
