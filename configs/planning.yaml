# Planning module configuration
battery:
  # 18650 cylindrical cell
  diameter_mm: 18.5
  length_mm: 65.0
  # For 21700 override in runtime: diameter=21, length=70

# TWELVE KEYS WERE DELETED FROM THIS FILE ON 2026-08-15, and one section
# was added. Every one of them was read by no Python anywhere in the tree
# (audit 2026-08-15 finding C1a; the same pass FDR v3 Appendix B struck
# them in and `configs/execution.yaml` got for its five `motion:` keys on
# 2026-08-12). What was here and is not:
#
#   cartridge.green_channel_thresh: otsu   `_green_mask` thresholds with
#       cv2.THRESH_OTSU unconditionally. There is no other mode to name.
#   cartridge.pcb_exclusion_required: true `extract` always subtracts the
#       PCB mask; there is no branch this could have switched off.
#   occupancy_grid.dtype: uint8            `plan.scene.OccupancyGrid`
#       allocates np.uint8. The cell encoding its comment carried is real
#       and is kept below, on the resolution key.
#   packing.algorithm: ffdh                THE WORST OF THEM: it named an
#       algorithm the planner stopped running on 2026-08-11. Both call
#       sites run `common.packing.pack_best_effort`.
#   packing.rotation_allowed: [0, 90]      `PlannerConfig` hardcodes
#       allow_rotation = True and never consults it. Wiring it belongs in
#       `PlannerConfig.from_dict`, which is where the field lives.
#   packing.deterministic: true            No reader. FFDH's determinism
#       is a property of the code, not a switch.
#   packing.worst_case_bound: 1.7          A theorem about FFDH, not a
#       knob; stated where it belongs, in common/packing.py.
#   packing.max_ms_budget: 50              Nothing measures against it.
#       The 50 ms budget is enforced by measurement, not by config.
#   queue.fill_order: row_major            Row-major is how the packer
#       emits cells; there is no other order to select.
#   queue.assignment: nearest_available    Same - `plan.planner` assigns
#       nearest-available and has no alternative.
#   camera.mm_per_px_y: 0.38               `PlannerConfig.from_dict`
#       reads mm_per_px_x only, and the whole pipeline carries ONE scalar
#       scale per frame. Declaring a second axis implied an anisotropic
#       calibration this code cannot represent.
#
# The two that were worse than merely dead, and are now WIRED instead of
# deleted: `cartridge.morph_close_ksize` / `.morph_open_ksize` are real
# constructor parameters of `HeuristicPlacementAreaExtractor` with the
# same names and the same values, so a reader checking whether the config
# reached the code would find the parameter and stop looking - while
# `main._build_planner` passed only `safety_margin_px`. `main.py` now
# passes all three. The values below are unchanged from the extractor's
# own defaults, so no measured number moves.
#
# `common.config.validate_planning` refuses any key not on its list, so a
# thirteenth cannot accumulate here unnoticed.
cartridge:
  # Image-plane green-channel mask params, read by
  # main._build_planner -> HeuristicPlacementAreaExtractor. Otsu on the
  # green channel, then close (k_close) to bridge, then open (k_open) to
  # drop speckle.
  morph_close_ksize: 5
  morph_open_ksize: 3
  safety_margin_px: 5

occupancy_grid:
  # Cell states, for reading a dumped grid: 0 = free, 1 = forbidden
  # (PCB), 2 = planned, 3 = placed. See plan.scene.CellState.
  resolution_mm_per_cell: 1.5

# The mirror image of the deleted keys, and it was in this same file:
# `PlannerConfig.from_dict` READS both of these, and no configuration
# stated either, so the pick grasp height and the place insert height
# came from dataclass defaults (FDR v3 Appendix B, corrected
# 2026-08-12). The numbers below ARE those defaults - this declares them,
# it does not change them.
motion:
  # The Z that goes on the wire as the PICK target, and it is a GRASP
  # height, not an approach: krl_prog/routines.src takes the commanded
  # pick pose as the point to close the gripper at and derives its own
  # approach (+60 mm). `motion.approach_height_mm` is refused BY NAME by
  # plan/planner.py; do not add it back.
  grasp_height_mm: 5.0
  # Place target Z. Note that the 16-byte frame has one Z field and the
  # pick needs it, so this is validated and then dropped - see
  # execution.execution.KUKA_CONTROLLER_INSERT_Z_MM, which is the depth
  # the controller actually inserts to.
  insert_height_mm: 2.0

# Cross-frame identity of the digital twin (plan.scene.TrackingConfig).
# These decide whether the robot's memory of what is already in a tray
# survives the next frame, so they are declared here rather than living
# as function defaults nobody could reach (audit H, finding 4: the IoU
# threshold was a parameter no caller and no config ever set).
tracking:
  # A detection at or above this IoU IS the tracked cartridge. Matching
  # is global-best-first, so this is a floor on acceptance, not a
  # tie-break: the highest-scoring pair in the frame is always taken
  # first.
  iou_match_threshold: 0.5
  # Frames a cartridge may go undetected before the twin forgets it and
  # everything it was holding. Not 0: a single missed frame used to
  # delete the occupancy grid, the reservations and the ID, and the
  # cartridge came back empty with its next place target aimed at a slot
  # that already held a cell. Expiry is counted and logged at WARNING.
  max_missing_frames: 5
  # An unmatched detection overlapping a cartridge already observed this
  # frame by at least this much is a SECOND VIEW of it (split mask,
  # duplicate box), not a second cartridge. Must be <= the match
  # threshold.
  duplicate_iou_threshold: 0.3
  # How far a matched cartridge's box may move before its measured
  # placement rectangle and occupancy grid are discarded and
  # re-extracted at the new position. One occupancy cell: the grid
  # cannot represent a finer distinction, so beyond it the stale
  # geometry is a lie the grid could have told the truth about.
  geometry_refresh_mm: 1.5

camera:
  # Pinhole calibration (mm per px). Replace with real intrinsics when
  # available. ONE scalar, deliberately: this is the FALLBACK for a frame
  # that carries no scale of its own, and every consumer of it
  # (PlannerConfig.mm_per_px, both extractors, plan.placement_area
  # ._resolve_scale) takes a single number. A `mm_per_px_y` sat here
  # until 2026-08-15 and was read by nothing, which advertised an
  # anisotropic calibration the pipeline cannot represent.
  mm_per_px_x: 0.38
  origin_offset_x_mm: 0.0
  origin_offset_y_mm: 0.0
  # PLACEHOLDER, and deliberately conservative: a +/-350 mm square
  # inscribed in the KR 6 R700 sixx's reachable envelope. The datasheet
  # (0000-210-361 / V23.1) gives maximum reach 706.7 mm, so the worst
  # case here — the corner, at 350*sqrt(2) = 495 mm — is comfortably
  # inside it on radius alone. `plan.scene.WorkspaceBounds.require`
  # enforces it on every pick and place pose.
  #
  # It is NOT the reachable workspace, in three named ways:
  #   1. It contains the base. The square includes (0, 0); a 6-axis arm
  #      cannot reach its own base column. The true envelope is an
  #      annulus with an inner dead zone, and every point within roughly
  #      a couple of hundred mm of the origin is claimed here and is not
  #      reachable. The dead-zone radius is not stated because the
  #      datasheet's working-range diagram is a raster image that could
  #      not be measured.
  #   2. A1 travels +/-170 deg, not +/-180. There is a ~20 deg
  #      unreachable wedge directly behind the robot; a square centred on
  #      the base spans every azimuth and so claims reach into it.
  #   3. Reach is a shell, not a prism. 706.7 mm is a radius, so the
  #      usable horizontal radius shrinks as Z approaches the table. A
  #      square valid at Z = 300 mm is not valid at Z = 0.
  # (Reach is also quoted to the wrist reference point, not to a TCP with
  # a vacuum tool fitted, which moves the envelope in both directions.)
  #
  # Modelling any of that needs the working-range diagram and a taught
  # tool, i.e. the real cell. Until then this is an outer bound that is
  # safe in the direction that matters and wrong in the middle.
  workspace_bounds_mm: {x_min: -350, x_max: 350, y_min: -350, y_max: 350}

# NO `arbitration:` BLOCK. It carried a single key, `tau: 0.7492`, which
# no Python ever read - the extractor took its own default (0.85) and
# the README quoted a third value (0.5715). The gate those numbers fed
# is retired: plan.arbitration's two placement estimates are the same
# argmax read twice, and their IoU correlates with placement error in
# the WRONG direction in all four cataloged SKUs (FDR v3 section
# 13.2.1, docs/receipts/tau_independence_correlation.txt). Their
# INTERSECTION is still applied unconditionally - that is a geometric
# constraint, not a threshold, and it needs no config. Do not re-add a
# tau key without a measurement that says what it would decide.
