# End-to-end demo config (software-only)
recognition: configs/recognition.yaml
planning: configs/planning.yaml
execution: configs/execution.yaml

mode:
  source: synthetic        # synthetic | camera | mock
  robot: mock              # mock | real
  max_cycles: 10
  log_level: INFO
  camera_device: 0
  # Frames for the software-only demo. Deliberately its own key rather than
  # recognition.dataset.img_dir: that one points at the Blender dataset the
  # detector TRAINS on (recog/dataset3d), which is not committed and is
  # regenerated by a different tool. The demo reads the cv2 generator's output
  # (`python -m recog.synth_dataset`), which is small and always present.
  img_dir: recog/dataset/images

# Reproducibility note (Plan D Task 7): this config is torch-FREE BY DESIGN
# - main.py's planner always uses HeuristicPlacementAreaExtractor here, and
# recog.inference.load_detector falls back to the pure-OpenCV
# HeuristicDetector whenever no checkpoint / torch is present, so the loop
# above runs on a machine with neither installed. `recog/checkpoints/` is
# gitignored and NO .pt is tracked anywhere in this repository, so the
# fallback is not a corner case: it is what every clone does.
#
# What this config produces, from a clean clone, after
# `python -m recog.synth_dataset --out recog/dataset --n 50`:
#
#   cycles 1, cartridges_detected 3, batteries_detected 5,
#   placement_areas 3, queue_poses 3, released_reservations 2,
#   placement_disagreements 0, bad_detector_boxes 0, placed 1
#
# Byte-identical across five consecutive runs, because synth_dataset.py is
# seeded (--seed, default 0). The run ends at cycle 1 of max_cycles 10
# because main.py's stop_on_empty_queue defaults to True and frame 1
# yields no executable pose. Receipt: docs/receipts/main_run.txt,
# regenerated by `python main.py --config configs/demo.yaml --receipt
# docs/receipts/main_run.txt`.
#
# CORRECTED 2026-08-12 (second time). This comment previously reported
# cartridges_detected 37, batteries_detected 77, placement_areas 33 and
# queue_poses 62 -> 41, "identical in all ten runs". Those runs were real
# but were NOT this path: they were made in a working tree that held
# recog/checkpoints/best.pt with torch installed, so load_detector
# returned the trained Faster R-CNN rather than the fallback this config
# is written around. No reader could reproduce them, and the figures are
# withdrawn rather than restated. The frame count was never the variable
# - the trained detector gives the same 37/77/41 on 50 frames as on 100.
# docs/superpowers/specs/2026-08-12-fix-first-impression.md.
#
# The first correction on this line still stands and is unrelated: the
# comment once blamed "CUDA/cuDNN algorithm-selection jitter on box scores
# that sit near main.py's decision thresholds" for the placed/pick_failed
# split and called the mock KUKA server "fully deterministic". Both are
# wrong (docs/superpowers/audit/2026-08-12-D-reproducibility.md Sec 5).
#
# The workspace envelope is enforced: `planning.camera.workspace_bounds_mm`
# was once parsed and compared against nothing, so the loop commanded
# points beyond the arm's reach. Because a fixed-mount camera legitimately
# images more table than the arm can reach, an out-of-reach candidate is
# SKIPPED AND COUNTED rather than aborting the run (this config aborted
# outright between 2026-08-11 and 2026-08-12). The run above declines 4
# place targets, 2 loose cells and 1 whole cartridge; those three counts
# are in the run summary and the receipt.
# See docs/superpowers/specs/2026-08-12-fix-demo-workspace.md.
#
# The placed/pick_failed split is the one number here that is NOT
# promisable, and the cause is a DELIBERATE simulated hardware failure,
# injected behind the robot protocol and downstream of everything torch
# touches: mock_kuka_server.py draws `random.random() < drop_prob` for a
# failed grip and `< drop_prob / 2` for a drop on insertion, from the
# unseeded module-global `random`. drop_prob is
# simulation.drop_probability: 0.02 in configs/execution.yaml. Per cycle
# P(failure) = 0.02 + 0.98*0.01 = 0.0298, so at the single cycle this
# config executes, about one run in thirty-four reports pick_failed 1
# rather than the placed 1 above. (At the 10 cycles max_cycles allows,
# it would be 1 - 0.9702^10 = 26% of runs.) It is genuine sampling, on
# purpose, so the retry and re-plan paths get exercised - and it is NOT
# GPU-related: the torch-free path this config is designed around shows
# the same variance.
#
# Cycle count, perception and planning counts, latency profile and
# "no crash" are the properties this config's demo run actually promises;
# the exact placed/pick_failed split is not one of them, with or without
# torch. Setting
# simulation.drop_probability to 0.0 (or seeding `random` in the mock)
# would make the placed count promisable too; that is a behaviour change
# and has deliberately not been made here.
