# End-to-end demo config (software-only)
recognition: configs/recognition.yaml
planning: configs/planning.yaml
execution: configs/execution.yaml

mode:
  source: synthetic        # synthetic | camera | mock
  robot: mock              # mock | real
  max_cycles: 10
  log_level: INFO
  camera_device: 0
  # Frames for the software-only demo. Deliberately its own key rather than
  # recognition.dataset.img_dir: that one points at the Blender dataset the
  # detector TRAINS on (recog/dataset3d), which is not committed and is
  # regenerated by a different tool. The demo reads the cv2 generator's output
  # (`python -m recog.synth_dataset`), which is small and always present.
  img_dir: recog/dataset/images

# Reproducibility note (Plan D Task 7): this config is torch-FREE BY DESIGN
# - main.py's planner always uses HeuristicPlacementAreaExtractor here, and
# recog.inference.load_detector falls back to the pure-OpenCV
# HeuristicDetector whenever no checkpoint / torch is present, so the loop
# above runs on a machine with neither installed.
#
# The per-cycle placed/pick_failed split is run-to-run non-deterministic
# (observed: 10/0, 9/1, 8/2 across otherwise-identical runs). CORRECTED
# 2026-08-12: this comment used to blame "CUDA/cuDNN algorithm-selection
# jitter on box scores that sit near main.py's decision thresholds" and
# called the mock KUKA server "fully deterministic". Both are wrong, and
# the demo was run 10 times to establish it
# (docs/superpowers/audit/2026-08-12-D-reproducibility.md Sec 5). In all
# ten runs EVERY perception and planning number was identical -
# cartridges_detected 37, batteries_detected 77, placement_areas 33,
# queue_poses 62, placement_disagreements 0, bad_detector_boxes 0 - and a
# normalised log diff across three of them was empty but for the
# ephemeral TCP port and wall-clock timings. Detector jitter would have
# moved those counts, and cannot produce a pick_failed at all.
#
# RE-MEASURED 2026-08-12, 10 runs, after the workspace envelope became
# load-bearing: same 37 / 77 / 33 / 0 / 0, released_reservations 2, and
# queue_poses 41 rather than 62. The 21 lost poses were pick or place
# points outside `planning.camera.workspace_bounds_mm` that the loop used
# to command anyway, because the envelope was parsed and compared against
# nothing. It is enforced now - and because a fixed-mount camera
# legitimately images more table than the arm can reach, an out-of-reach
# candidate is SKIPPED AND COUNTED rather than aborting the run (this
# config aborted outright between 2026-08-11 and 2026-08-12). Each of the
# ten runs declined 14 place targets, 15 loose cells and 2 whole
# cartridges; those three counts are in the run summary and the receipt.
# See docs/superpowers/specs/2026-08-12-fix-demo-workspace.md.
#
# The actual cause is a DELIBERATE simulated hardware failure, injected
# behind the robot protocol and downstream of everything torch touches:
# mock_kuka_server.py draws `random.random() < drop_prob` for a failed
# grip and `< drop_prob / 2` for a drop on insertion, from the unseeded
# module-global `random`. drop_prob is simulation.drop_probability: 0.02
# in configs/execution.yaml. Per cycle P(failure) = 0.02 + 0.98*0.01 =
# 0.0298, so P(a 10-cycle run is not 10/10) = 1 - 0.9702^10 = 26%; 1 of
# 10 observed runs is well inside binomial noise for that. It is genuine
# sampling, on purpose, so the retry and re-plan paths get exercised -
# and it is NOT GPU-related: the torch-free path this config is designed
# around shows the same variance.
#
# Cycle count, latency profile and "no crash" are the properties this
# config's demo run actually promises; the exact placed/pick_failed split
# is not one of them, with or without torch. Setting
# simulation.drop_probability to 0.0 (or seeding `random` in the mock)
# would make the placed count promisable too; that is a behaviour change
# and has deliberately not been made here.
