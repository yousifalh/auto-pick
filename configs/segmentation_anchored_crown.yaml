# Bay segmenter, trained on the CROWNED-LID procedural tray set - the
# sealed-unit experiment (docs/superpowers/specs/2026-08-11-sealed-unit-
# experiment.md). EXACTLY THREE keys differ from
# configs/segmentation_anchored.yaml - dataset.coco_path, dataset.img_dir
# and training.checkpoint_dir - asserted key-by-key before training, not
# eyeballed. Architecture, schedule, augmentation, split seed and jitter
# are all identical, so this run and seg_anchored differ in the DATASET
# alone, and the two datasets differ in the lid crown alone.
model:
  num_classes: 6        # background, cartridge, bay, electronics, obstruction, battery
  pretrained: true
  crop_size: 256        # at or above native crop resolution; see bay_segmenter
  half: true            # fp16 - load-bearing for the 50 ms budget

dataset:
  # recog/dataset3d_seg_anchored_crown: 502 scenes, the SAME anchored
  # procedural trays as recog/dataset3d_seg_anchored (same seed, same
  # sampler; the pool was verified tray-by-tray to be bit-identical on
  # every field except lid_crown_mm - 0 mismatches over all 502), with a
  # sampled fillet rolled onto the lid's four top edges. Produced with:
  #   blender -b --python recog/generate3d.py -- --n 502
  #       --out recog/dataset3d_seg_anchored_crown --device GPU
  #       --tray-set anchored --config configs/synth3d_crown.yaml --resume
  coco_path: recog/dataset3d_seg_anchored_crown/instances_seg.json
  img_dir: recog/dataset3d_seg_anchored_crown/images
  train_val_split: 0.85
  # Both the split RNG and index-assignment RNG (see recog.seg_dataset's
  # per-dataset jitter rng) are seeded; this is the split seed specifically,
  # logged every run so the exact train/val partition is reproducible.
  split_seed: 0
  # Jitter magnitude should match the detector's measured box error, not be
  # chosen. Run recog.eval_real and read the median IoU of matched cartridge
  # boxes; 0.06 corresponds to roughly IoU 0.88.
  jitter_frac: 0.06

training:
  epochs: 40
  batch_size: 8         # crops are 256px, far smaller than the detector's
  num_workers: 0        # Windows spawn; raise on Linux
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  lr_scheduler: cosine
  dice_weight: 0.5
  # Randomness. `seed` fixes model init, the shuffle order, the crop
  # jitter and the augmentation pipeline; the resolved value is logged
  # every run and written into every checkpoint. Override with `--seed`.
  #
  # `deterministic` was chosen by measurement, not preference
  # (docs/receipts/seed_reproducibility.txt):
  #   off    seeded only - and on CUDA that is NOT enough. Two runs at
  #          one seed diverge from step 1 (cuDNN algorithm heuristics,
  #          atomics in the backward kernels); after one epoch two
  #          same-seed pairs sat 0.0197 / 0.0076 apart in mean loss and
  #          0.0101 / 0.0409 apart in selected IoU.
  #   warn   the default. Deterministic kernels wherever torch has them,
  #          a warning wherever it does not. Measured: two runs at one
  #          seed produce bit-identical weights.
  #   strict refuses to train this model at all -
  #          `nll_loss2d_forward_out_cuda_template does not have a
  #          deterministic implementation` on the first batch.
  # None of the three changes the schedule, the metric or the model.
  seed: 20260812
  deterministic: warn
  checkpoint_dir: recog/checkpoints/seg_anchored_crown
  # Selection is on bay/electronics/obstruction IoU only. Including
  # background and cartridge lets a model that gets the big easy regions
  # right mask a failure on the three classes the placement mask needs.
  select_on: [bay, electronics, obstruction]

augmentation:
  brightness_limit: 0.55
  contrast_limit: 0.50
  gamma_limit: [45, 190]
  hue_shift_limit: 15
  sat_shift_limit: 30
  val_shift_limit: 20
  motion_blur_limit: [3, 11]
  gauss_noise_std_range: [0.02, 0.14]
  p_photometric: 0.85
  p_flip: 0.5
  p_rot90: 0.5
  p_camera: 0.6
