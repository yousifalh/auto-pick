# Bay segmenter. Separate from recognition.yaml on purpose: the detector's
# config, checkpoints and published numbers are not touched by this work.
model:
  num_classes: 6        # background, cartridge, bay, electronics, obstruction, battery
  pretrained: true
  crop_size: 256        # at or above native crop resolution; see bay_segmenter
  half: true            # fp16 - load-bearing for the 50 ms budget

dataset:
  # recog/dataset3d/instances_seg.json (the brief's stated path) predates
  # the segmentation work and does not exist. recog/dev3d has a sidecar
  # but only 42 crops - a smoke-test size, not a training set. This is a
  # dedicated generation (started at --n 300, completed at 220 scenes),
  # produced with:
  #   blender -b --python recog/generate3d.py -- \
  #       --n 300 --out recog/dataset3d_seg --device GPU --resume
  # 220 scenes / 2043 annotations -> 361 crops via BaySegDataset. Class
  # balance is uneven by construction (see recog/seg_dataset.py's module
  # docstring): only 84 crops carry `bay`, 84 `electronics`, 49
  # `obstruction` - so the validation slice of those is a few dozen
  # crops at most. seg_training.py logs the per-class validation
  # instance count next to every IoU for exactly this reason.
  coco_path: recog/dataset3d_seg/instances_seg.json
  img_dir: recog/dataset3d_seg/images
  train_val_split: 0.85
  # Both the split RNG and index-assignment RNG (see recog.seg_dataset's
  # per-dataset jitter rng) are seeded; this is the split seed specifically,
  # logged every run so the exact train/val partition is reproducible.
  split_seed: 0
  # Jitter magnitude should match the detector's measured box error, not be
  # chosen. Run recog.eval_real and read the median IoU of matched cartridge
  # boxes; 0.06 corresponds to roughly IoU 0.88.
  jitter_frac: 0.06

training:
  epochs: 40
  batch_size: 8         # crops are 256px, far smaller than the detector's
  num_workers: 0        # Windows spawn; raise on Linux
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  lr_scheduler: cosine
  dice_weight: 0.5
  checkpoint_dir: recog/checkpoints/seg
  # Selection is on bay/electronics/obstruction IoU only. Including
  # background and cartridge lets a model that gets the big easy regions
  # right mask a failure on the three classes the placement mask needs.
  select_on: [bay, electronics, obstruction]

augmentation:
  brightness_limit: 0.55
  contrast_limit: 0.50
  gamma_limit: [45, 190]
  hue_shift_limit: 15
  sat_shift_limit: 30
  val_shift_limit: 20
  motion_blur_limit: [3, 11]
  gauss_noise_std_range: [0.02, 0.14]
  p_photometric: 0.85
  p_flip: 0.5
  p_rot90: 0.5
  p_camera: 0.6
