# Bay segmenter EVALUATION config for the held-out CAD test set (spec #2,
# generalisation plan Task 19). Not used for training - train_val_split is
# 0.0 so `_split_dataset`'s n_train = round(0.0 * n) = 0, putting every crop
# in the validation split. This set was never trained on by any of the six
# models it evaluates; nothing here should be excluded as "training data".
model:
  num_classes: 6        # background, cartridge, bay, electronics, obstruction, battery
  pretrained: true
  crop_size: 256        # at or above native crop resolution; see bay_segmenter
  half: true            # fp16 - load-bearing for the 50 ms budget

dataset:
  # recog/dataset3d_seg_cad_test: held-out CAD-only test set (generalisation
  # plan Task 16, the four Anker assemblies, --tray-set defaults to cad),
  # produced with:
  #   blender -b --python recog/generate3d.py -- --n 500 \
  #       --out recog/dataset3d_seg_cad_test --device GPU --resume
  coco_path: recog/dataset3d_seg_cad_test/instances_seg.json
  img_dir: recog/dataset3d_seg_cad_test/images
  train_val_split: 0.0
  split_seed: 0
  jitter_frac: 0.06

training:
  epochs: 40
  batch_size: 8
  num_workers: 0
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  lr_scheduler: cosine
  dice_weight: 0.5
  # Randomness. `seed` fixes model init, the shuffle order, the crop
  # jitter and the augmentation pipeline; the resolved value is logged
  # every run and written into every checkpoint. Override with `--seed`.
  #
  # `deterministic` was chosen by measurement, not preference
  # (docs/receipts/seed_reproducibility.txt):
  #   off    seeded only - and on CUDA that is NOT enough. Two runs at
  #          one seed diverge from step 1 (cuDNN algorithm heuristics,
  #          atomics in the backward kernels); after one epoch two
  #          same-seed pairs sat 0.0197 / 0.0076 apart in mean loss and
  #          0.0101 / 0.0409 apart in selected IoU.
  #   warn   the default. Deterministic kernels wherever torch has them,
  #          a warning wherever it does not. Measured: two runs at one
  #          seed produce bit-identical weights.
  #   strict refuses to train this model at all -
  #          `nll_loss2d_forward_out_cuda_template does not have a
  #          deterministic implementation` on the first batch.
  # None of the three changes the schedule, the metric or the model.
  seed: 20260812
  deterministic: warn
  checkpoint_dir: recog/checkpoints/seg
  select_on: [bay, electronics, obstruction]

augmentation:
  brightness_limit: 0.55
  contrast_limit: 0.50
  gamma_limit: [45, 190]
  hue_shift_limit: 15
  sat_shift_limit: 30
  val_shift_limit: 20
  motion_blur_limit: [3, 11]
  gauss_noise_std_range: [0.02, 0.14]
  p_photometric: 0.85
  p_flip: 0.5
  p_rot90: 0.5
  p_camera: 0.6
